name: Upstream version check

# Detects when Anthropic publishes a Claude Desktop version newer than the
# CLAUDE_VERSION pinned in claude-desktop.pin (read from Anthropic's official
# APT repo, for every arch the image ships), and bumps it automatically:
#
#   1. download the new amd64 and arm64 .debs and verify each against the
#      SHA256 the repo's Packages index lists
#   2. rewrite the version + hash pins via scripts/utils/bump-claude-version.sh
#   3. build an amd64 candidate image and run the boot smoke test against it
#   4. open a PR with the bump (branch auto-bump/claude-<version>)
#
# Merging that PR triggers publish-on-bump-merge.yml, which tags v<version>
# and dispatches the Docker Hub multi-arch publish. The PR merge is the human
# gate — nothing is published without it.
#
# If any bump step fails (package moved mid-run, build broke, smoke test
# red), the workflow fails loudly. check-upstream-version.sh also fails when
# the feed itself stops being re-signed, so a feed that moves elsewhere can't
# pass silently the way the old Windows feed did.
#
# Requires the repo setting: Settings → Actions → General →
# "Allow GitHub Actions to create and approve pull requests".

on:
  schedule:
    - cron: '17 6 * * 1'   # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Compare pinned CLAUDE_VERSION with the upstream APT repo
        id: drift
        run: |
          PINNED=$(. ./claude-desktop.pin && echo "$CLAUDE_VERSION")
          UPSTREAM=$(bash scripts/utils/check-upstream-version.sh --upstream-only)
          echo "pinned:   $PINNED"
          echo "upstream: $UPSTREAM"
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"
          if [ "$PINNED" = "$UPSTREAM" ]; then
            echo "OK: pinned version matches upstream"
            echo "bump=false" >> "$GITHUB_OUTPUT"
          elif [ "$(printf '%s\n' "$PINNED" "$UPSTREAM" | sort -V | tail -1)" = "$UPSTREAM" ]; then
            echo "upstream moved forward — starting auto-bump"
            echo "bump=true" >> "$GITHUB_OUTPUT"
          else
            # A version going BACKWARD is not a release — it's a rollback or a
            # tampered bucket. Never auto-bump toward it; a human must look.
            echo "ERROR: upstream ($UPSTREAM) is OLDER than the pin ($PINNED); refusing to auto-bump." >&2
            exit 1
          fi

      - name: Download the new .debs and verify their SHA256
        if: steps.drift.outputs.bump == 'true'
        id: sha
        env:
          UPSTREAM: ${{ steps.drift.outputs.upstream }}
        run: |
          # Download each .deb and check it against the hash in the Packages
          # index, so we never pin the hash of a corrupt or missing object
          # (the index can briefly run ahead of the CDN).
          BASE=https://downloads.claude.ai/claude-desktop/apt/stable/pool/main/c/claude-desktop
          for ARCH in amd64 arm64; do
            EXPECTED=$(bash scripts/utils/check-upstream-version.sh --sha256 "$ARCH" "$UPSTREAM")
            curl -fsSL --retry 5 --retry-delay 30 --retry-all-errors \
              -o "/tmp/claude_$ARCH.deb" "$BASE/claude-desktop_${UPSTREAM}_${ARCH}.deb"
            ACTUAL=$(sha256sum "/tmp/claude_$ARCH.deb" | cut -d' ' -f1)
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "ERROR: $ARCH SHA256 mismatch vs Packages index (expected '$EXPECTED', got '$ACTUAL')" >&2
              exit 1
            fi
            echo "sha256_$ARCH=$ACTUAL" >> "$GITHUB_OUTPUT"
          done

      - name: Bump pinned version and hashes
        if: steps.drift.outputs.bump == 'true'
        run: >-
          bash scripts/utils/bump-claude-version.sh
          "${{ steps.drift.outputs.upstream }}"
          "${{ steps.sha.outputs.sha256_amd64 }}"
          "${{ steps.sha.outputs.sha256_arm64 }}"

      - name: Set up Docker Buildx
        if: steps.drift.outputs.bump == 'true'
        uses: docker/setup-buildx-action@v2
        with:
          install: true

      - name: Login to Docker Hub (for build cache)
        if: steps.drift.outputs.bump == 'true'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build candidate image (amd64)
        if: steps.drift.outputs.bump == 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./dockerhub/Dockerfile.dockerhub
          platforms: linux/amd64
          load: true
          tags: claude-desktop-smoke:test
          build-args: |
            NODE_VERSION=22.x
          cache-from: type=registry,ref=fjmerc/claude-desktop:buildcache

      - name: Smoke test the candidate image
        if: steps.drift.outputs.bump == 'true'
        run: bash scripts/utils/smoke-test-image.sh claude-desktop-smoke:test

      - name: Open bump PR
        if: steps.drift.outputs.bump == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto-bump/claude-${{ steps.drift.outputs.upstream }}
          delete-branch: true
          commit-message: "chore: bump Claude Desktop ${{ steps.drift.outputs.pinned }} -> ${{ steps.drift.outputs.upstream }}"
          title: "chore: bump Claude Desktop ${{ steps.drift.outputs.pinned }} -> ${{ steps.drift.outputs.upstream }}"
          body: |
            Anthropic's Claude Desktop APT repo now publishes `${{ steps.drift.outputs.upstream }}` (amd64 + arm64),
            this repo pinned `${{ steps.drift.outputs.pinned }}`.

            - `claude-desktop.pin` and every other hardcoded version string bumped `${{ steps.drift.outputs.pinned }}` -> `${{ steps.drift.outputs.upstream }}`
            - per-arch SHA256 re-pinned (each .deb downloaded and checked against the Packages index):
              - amd64 `${{ steps.sha.outputs.sha256_amd64 }}`
              - arm64 `${{ steps.sha.outputs.sha256_arm64 }}`
            - An amd64 image built from this change passed the boot smoke test in the workflow run that opened this PR

            **Merging this PR publishes automatically:** `publish-on-bump-merge.yml`
            tags `v${{ steps.drift.outputs.upstream }}` and dispatches the Docker Hub
            multi-arch publish (which re-verifies the pin and re-runs the smoke test).
